name: iOS build

# Builds and ships the crew app from a commit, on GitHub's macOS runners.
#
# Nothing here touches Connor's laptop. The signing certificate, its private key
# and the provisioning profile live as repository secrets, so a build works from
# a phone, a borrowed machine, or nothing at all.
#
# Run it from the Actions tab, or let it fire when ios/** changes.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to TestFlight after building"
        type: boolean
        default: true
  push:
    paths: ["ios/**", "app.json", "package.json", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # iOS builds fail on newer; pinned deliberately
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      # A throwaway keychain, so the runner never inherits or leaves state.
      - name: Load signing certificate
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 -d > /tmp/dist.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k runner build.keychain
          rm /tmp/dist.p12

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > /tmp/p.mobileprovision
          UUID=$(security cms -D -i /tmp/p.mobileprovision \
                 | plutil -extract UUID raw -o - -)
          cp /tmp/p.mobileprovision \
             ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Archive
        working-directory: ios
        run: |
          SCHEME=$(ls -d *.xcworkspace | head -1 | sed 's/.xcworkspace//')
          xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export .ipa
        run: |
          cat > /tmp/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist /tmp/export.plist \
            -exportPath "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.submit }}
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -t ios \
            -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
